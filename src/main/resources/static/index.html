<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UniManager - University Management System</title>
    <style>
        :root{--primary:#667eea;--primary-d:#5568d3;--danger:#ef4444;--success:#10b981;--text:#374151;--muted:#6b7280;--border:#e5e7eb}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f3f4f6;color:var(--text);min-height:100vh}
        button,input{font:inherit}
        .hidden{display:none!important}

        /* ---------- Login ---------- */
        #loginView{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
            background:linear-gradient(135deg,#667eea 0%,#764ba2 100%)}
        .login-card{background:#fff;border-radius:14px;padding:36px;width:100%;max-width:400px;
            box-shadow:0 12px 32px rgba(0,0,0,.25);text-align:center}
        .logo{font-size:44px}
        .login-card h1{margin:8px 0 4px;font-size:26px}
        .sub{color:var(--muted);font-size:14px;margin-bottom:20px}
        .hint{margin-top:20px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted)}
        .alert{background:#fee2e2;color:#991b1b;padding:10px;border-radius:6px;font-size:14px;margin-bottom:6px}

        /* ---------- Forms & buttons ---------- */
        label{display:block;text-align:left;font-size:13px;font-weight:600;margin:12px 0 6px}
        input{width:100%;padding:10px 12px;border:2px solid var(--border);border-radius:6px;font-size:14px}
        input:focus{outline:none;border-color:var(--primary)}
        input[readonly]{background:#f3f4f6}
        .btn{padding:10px 18px;border:0;border-radius:6px;font-weight:600;font-size:14px;cursor:pointer;color:#fff;transition:.2s}
        .btn.sm{padding:6px 12px;font-size:13px}
        .btn.block{width:100%;margin-top:20px}
        .btn.primary{background:var(--primary)} .btn.primary:hover{background:var(--primary-d)}
        .btn.success{background:var(--success)} .btn.danger{background:var(--danger)} .btn.gray{background:var(--muted)}
        .btn.light{background:#eef0ff;color:var(--primary)}

        /* ---------- Top nav ---------- */
        .top{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.1);display:flex;align-items:center;gap:24px;
            padding:12px 28px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
        .brand{font-weight:700;font-size:20px;color:var(--primary)}
        nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
        nav a{padding:8px 14px;border-radius:6px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
        nav a:hover{background:#f3f4f6}
        nav a.active{background:#eef0ff;color:var(--primary)}
        .user{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted)}

        /* ---------- Content ---------- */
        main{max-width:1100px;margin:28px auto;padding:0 20px}
        .title{font-size:28px}
        .subtitle{color:var(--muted);margin:4px 0 20px}
        .muted{color:var(--muted);font-size:14px}
        .page-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:18px;margin-bottom:24px}
        .stat,.card{background:#fff;border-radius:10px;padding:22px;box-shadow:0 2px 6px rgba(0,0,0,.08)}
        .icon{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:12px}
        .icon.blue{background:#dbeafe} .icon.green{background:#d1fae5} .icon.orange{background:#ffedd5}
        .num{font-size:30px;font-weight:700}
        .lbl{color:var(--muted);font-size:14px}
        .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
        .bar{margin-bottom:14px} .bar input{max-width:320px}
        .tw{overflow-x:auto}
        table{width:100%;border-collapse:collapse}
        th{background:#f9fafb;text-align:left;padding:12px;font-size:13px;border-bottom:2px solid var(--border)}
        td{padding:12px;font-size:14px;border-bottom:1px solid var(--border)}
        tr:hover td{background:#f9fafb}
        .act{display:flex;gap:8px}
        .empty,.loading{text-align:center;color:var(--muted);padding:30px}

        /* ---------- Profile ---------- */
        .profile{max-width:520px;text-align:center}
        .avatar{width:72px;height:72px;border-radius:50%;background:var(--primary);color:#fff;font-size:30px;font-weight:700;
            display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
        dl{text-align:left;margin:20px 0;display:grid;grid-template-columns:120px 1fr;gap:10px;font-size:14px}
        dt{color:var(--muted);font-weight:600}
        .row-end{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
        .profile .row-end{justify-content:center}

        /* ---------- Modal & toast ---------- */
        .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
        .modal-box{background:#fff;border-radius:12px;padding:26px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
        #toast{position:fixed;right:20px;bottom:20px;padding:12px 18px;border-radius:8px;color:#fff;font-size:14px;opacity:0;transition:.3s;z-index:30}
        #toast.ok{background:var(--success)} #toast.err{background:var(--danger)}
    </style>
</head>
<body>

<div id="toast"></div>

<!-- ============ LOGIN ============ -->
<div id="loginView">
    <form class="login-card" onsubmit="login(event)">
        <div class="logo">🎓</div>
        <h1>Welcome Back</h1>
        <p class="sub">Sign in to University Management System</p>
        <div id="loginErr" class="alert hidden"></div>
        <label for="u">Username</label>
        <input id="u" required autofocus placeholder="Enter your username">
        <label for="p">Password</label>
        <input id="p" type="password" required placeholder="Enter your password">
        <button class="btn primary block">Sign In</button>
        <p class="hint">Demo admin: <b>admin</b> / <b>admin123</b></p>
    </form>
</div>

<!-- ============ APP ============ -->
<div id="appView" class="hidden">
    <header class="top">
        <div class="brand">🎓 UniManager</div>
        <nav id="nav"></nav>
        <div class="user"><span id="badge"></span><button class="btn light sm" onclick="logout()">Logout</button></div>
    </header>
    <main id="main"></main>
</div>

<!-- ============ ADD / EDIT MODAL ============ -->
<div id="modal" class="modal hidden">
    <form class="modal-box" onsubmit="save(event)">
        <h3 id="mTitle"></h3>
        <div id="mFields"></div>
        <div class="row-end">
            <button type="button" class="btn gray" onclick="closeModal()">Cancel</button>
            <button class="btn primary">Save</button>
        </div>
    </form>
</div>

<script>
    const RES = {
        admins:   {label: 'Admin',   extra: null},
        teachers: {label: 'Teacher', extra: {key: 'department', label: 'Department'}},
        students: {label: 'Student', extra: {key: 'studentId',  label: 'Student ID'}}
    };
    const ERRORS = {400: 'Invalid input, check all fields', 401: 'Please login first', 403: 'Access denied (403)',
        404: 'Record not found', 409: 'Username or email already exists'};

    let me = null, page = 'dashboard', res = null, list = [], editId = null, q = '';
    const $ = id => document.getElementById(id);
    const isAdmin = () => me.role === 'ADMIN';
    const esc = s => String(s ?? '').replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function toast(text, ok = true) {
        const t = $('toast');
        t.textContent = text; t.className = ok ? 'ok' : 'err'; t.style.opacity = 1;
        clearTimeout(window._t); window._t = setTimeout(() => t.style.opacity = 0, 3500);
    }

    async function api(url, opt = {}) {
        const r = await fetch(url, {headers: {'Content-Type': 'application/json'}, ...opt});
        if (r.status === 204) return null;
        if (!r.ok) throw new Error(ERRORS[r.status] || 'Error ' + r.status);
        return r.json();
    }

    /* ---------- Auth ---------- */
    async function login(e) {
        e.preventDefault();
        try {
            const r = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: new URLSearchParams({username: $('u').value, password: $('p').value})
            });
            if (!r.ok) throw new Error('Invalid username or password');
            me = await r.json();
            $('loginErr').classList.add('hidden');
            $('loginView').classList.add('hidden');
            $('appView').classList.remove('hidden');
            $('badge').textContent = me.username + ' · ' + me.role;
            go(isAdmin() ? 'dashboard' : 'profile');
        } catch (err) {
            const a = $('loginErr'); a.textContent = err.message; a.classList.remove('hidden');
        }
    }

    async function logout() {
        try { await fetch('/api/auth/logout', {method: 'POST'}); } catch (e) {}
        me = null;
        $('appView').classList.add('hidden');
        $('loginView').classList.remove('hidden');
        $('p').value = '';
    }

    /* ---------- Navigation ---------- */
    function buildNav() {
        const items = isAdmin()
            ? [['dashboard','Dashboard'], ['admins','Admins'], ['teachers','Teachers'], ['students','Students']]
            : [['profile','My Profile']];
        $('nav').innerHTML = items.map(([k, l]) =>
            `<a href="#" class="${k === page ? 'active' : ''}" onclick="go('${k}');return false">${l}</a>`).join('');
    }

    function go(p) {
        page = p; q = ''; buildNav();
        if (p === 'dashboard') dashboard();
        else if (p === 'profile') profile();
        else resource(p);
    }

    /* ---------- Dashboard (admin) ---------- */
    const stat = (c, i, v, l) =>
        `<div class="stat"><div class="icon ${c}">${i}</div><div class="num">${v}</div><div class="lbl">${l}</div></div>`;

    async function dashboard() {
        $('main').innerHTML = '<div class="loading">Loading...</div>';
        try {
            const [a, t, s] = await Promise.all(['admins', 'teachers', 'students'].map(r => api('/api/' + r)));
            const recent = [...s].sort((x, y) => y.id - x.id).slice(0, 5);
            $('main').innerHTML = `
      <h1 class="title">Dashboard</h1>
      <p class="subtitle">Welcome, ${esc(me.username)}</p>
      <div class="stats">
        ${stat('blue', '🎓', s.length, 'Total Students')}
        ${stat('green', '👨‍🏫', t.length, 'Total Teachers')}
        ${stat('orange', '🛡️', a.length, 'Admins')}
      </div>
      <div class="card">
        <div class="card-head"><h3>Recent Students</h3>
          <button class="btn light sm" onclick="go('students')">View All</button></div>
        ${table(recent, 'students', false)}
      </div>`;
        } catch (e) { toast(e.message, false); }
    }

    /* ---------- Table + resource page (admin) ---------- */
    function table(items, r, actions = true) {
        const ex = RES[r].extra;
        if (!items.length) return '<p class="empty">No records found</p>';
        return `<div class="tw"><table><thead><tr><th>ID</th><th>Name</th><th>Username</th><th>Email</th>`
            + (ex ? `<th>${ex.label}</th>` : '') + (actions ? '<th>Actions</th>' : '') + '</tr></thead><tbody>'
            + items.map(x => `<tr><td>${x.id}</td><td>${esc(x.fullName)}</td><td>${esc(x.username)}</td><td>${esc(x.email)}</td>`
                + (ex ? `<td>${esc(x[ex.key])}</td>` : '')
                + (actions ? `<td class="act"><button class="btn primary sm" onclick="openForm(${x.id})">Edit</button>
                    <button class="btn danger sm" onclick="del(${x.id})">Delete</button></td>` : '')
                + '</tr>').join('')
            + '</tbody></table></div>';
    }

    async function resource(r) {
        res = r;
        $('main').innerHTML = `
    <div class="page-head">
      <div><h1 class="title">${RES[r].label}s</h1><p class="subtitle">Manage ${r}</p></div>
      <button class="btn success" onclick="openForm()">+ Add ${RES[r].label}</button>
    </div>
    <div class="card">
      <div class="bar"><input placeholder="Search..." oninput="q=this.value;paint()"></div>
      <div id="tbl"><div class="loading">Loading...</div></div>
    </div>`;
        try { list = await api('/api/' + r); paint(); } catch (e) { toast(e.message, false); }
    }

    function paint() {
        const s = q.toLowerCase();
        $('tbl').innerHTML = table(list.filter(x => Object.values(x).join(' ').toLowerCase().includes(s)), res);
    }

    /* ---------- Profile (teacher / student: own record only) ---------- */
    async function profile() {
        res = me.role.toLowerCase() + 's';
        try {
            const x = await api('/api/' + res + '/' + me.id);
            list = [x];
            const ex = RES[res].extra;
            $('main').innerHTML = `
      <h1 class="title">My Profile</h1>
      <p class="subtitle">You can manage only your own record</p>
      <div class="card profile">
        <div class="avatar">${esc((x.fullName || '?')[0])}</div>
        <h2>${esc(x.fullName)}</h2>
        <p class="muted">${esc(x.role)}</p>
        <dl>
          <dt>Username</dt><dd>${esc(x.username)}</dd>
          <dt>Email</dt><dd>${esc(x.email)}</dd>
          ${ex ? `<dt>${ex.label}</dt><dd>${esc(x[ex.key]) || '-'}</dd>` : ''}
        </dl>
        <div class="row-end">
          <button class="btn primary" onclick="openForm(${x.id})">Edit Profile</button>
          <button class="btn danger" onclick="del(${x.id})">Delete Account</button>
        </div>
      </div>`;
        } catch (e) { toast(e.message, false); }
    }

    /* ---------- Add / Edit / Delete ---------- */
    function field(k, l, v, opts = {}) {
        return `<label for="f_${k}">${l}</label>
    <input id="f_${k}" type="${opts.type || 'text'}" value="${esc(v)}" placeholder="${esc(opts.ph || '')}"
      ${opts.ro ? 'readonly' : ''} ${opts.req ? 'required' : ''}>`;
    }

    function openForm(id) {
        editId = id || null;
        const x = id ? list.find(i => i.id === id) : {};
        const ex = RES[res].extra;
        $('mTitle').textContent = (id ? 'Edit ' : 'Add ') + RES[res].label;
        $('mFields').innerHTML =
            field('username', 'Username', x.username, {req: true, ro: id && !isAdmin()}) +
            field('password', 'Password', '', {type: 'password', req: !id, ph: id ? 'Leave blank to keep current' : ''}) +
            field('fullName', 'Full Name', x.fullName, {req: true}) +
            field('email', 'Email', x.email, {type: 'email', req: true}) +
            (ex ? field(ex.key, ex.label, x[ex.key]) : '');
        $('modal').classList.remove('hidden');
    }

    function closeModal() { $('modal').classList.add('hidden'); }

    async function save(e) {
        e.preventDefault();
        const ex = RES[res].extra;
        const body = {username: $('f_username').value, password: $('f_password').value || null,
            fullName: $('f_fullName').value, email: $('f_email').value, department: null, studentId: null};
        if (ex) body[ex.key] = $('f_' + ex.key).value || null;
        try {
            if (editId) await api(`/api/${res}/${editId}`, {method: 'PUT', body: JSON.stringify(body)});
            else await api(`/api/${res}`, {method: 'POST', body: JSON.stringify(body)});
            toast(editId ? 'Updated successfully' : 'Created successfully');
            closeModal(); go(page);
        } catch (err) { toast(err.message, false); }
    }

    async function del(id) {
        if (res === 'admins' && id === me.id) { toast('You cannot delete your own admin account', false); return; }
        if (!confirm('Delete this record permanently?')) return;
        try {
            await api(`/api/${res}/${id}`, {method: 'DELETE'});
            toast('Deleted successfully');
            if (isAdmin()) go(page); else logout();
        } catch (e) { toast(e.message, false); }
    }
</script>
</body>
</html>
